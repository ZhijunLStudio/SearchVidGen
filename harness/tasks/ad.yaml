# 营销广告短片任务：证明"任务层与核心解耦"——换业务只改本文件
# 用法：python -m vidharness.cli run tasks/ad.yaml --query "夏天第一杯冷萃咖啡"

task_name: ad_short

task:
  system: "你是资深广告创意总监，擅长把产品卖点转成 15-30 秒的有感广告短片。"
  user_template: |
    请根据产品/主题"{query}"，创作一个有情绪钩子的广告短片分镜计划，共{segment_count}段（每段5-8秒）。

    ## 要求
    1. 全片同一主角/产品外观描述保持一致（每段 video_prompt 用相同措辞）
    2. 每段 video_prompt 中文 40-70 字：镜头运动、主体动作、环境氛围、产品高光时刻
    3. video_prompt 末尾："音频：<环境音/音效>，并用中文旁白清晰朗读：「<该段 narration>」"
    4. 段间机位/景别必须变化，避免冻结帧
    5. narration：≤12 字广告文案，情绪递进（钩子→痛点→产品→行动号召）

    ## 严格按 JSON 输出：
    {{"segments": [{{"video_prompt": "...", "narration": "...", "duration": 6}}]}}
  defaults:
    segment_count: 4

pipeline:
  script:
    adapter: script.deepseek-v4-flash
    params: {model: deepseek-chat, temperature: 0.9}
  generator:
    adapter: generator.minimax-h3-local
    params:
      model_path: /data-ssd/lizhijun/models/MiniMax-H3
      gpu: "4,6"
      variant: t2va
      steps: 30
      seed: 20260815
  context:
    chain_mode: none
    anchor_refs: []

judge:
  adapter: judge.openai-compat
  params:
    base_url: http://127.0.0.1:8030/v1
    model: judge-qwen3.5-27b
    frame_samples: 4
    disable_thinking: true

segment_judge:
  - {name: 与指令一致性, question: "视频是否准确呈现生成指令描述的主体、动作、镜头与环境？", weight: 1.0, min_score: 6, aliases: [一致性]}
  - {name: 画面质量, question: "是否存在明显缺陷（肢体畸形、闪变、主体崩坏、水印杂质）？无缺陷给高分", weight: 1.0, min_score: 6}
  - {name: 广告信息有效, question: "画面是否清晰突出产品/主题卖点，具备广告传播力？", weight: 1.2, min_score: 6}

cross_judge:
  - {name: 跨段一致性, question: "上一段结尾与下一段开头：人物/产品外观是否一致、场景是否自然衔接？", weight: 1.0, min_score: 6}
  - {name: 叙事推进, question: "这两帧是否为合理推进的新镜头（机位/景别有变化），而不是同一画面复制？", weight: 1.0, min_score: 5}

segment_retry: {max_attempts: 2, inject_feedback: true}

audio_verify:
  adapter: transcribe.sensevoice-small
