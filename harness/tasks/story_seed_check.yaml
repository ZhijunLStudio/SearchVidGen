# 生成确定性检验基座任务（E43）：单段、无剧本评审、剧本温度 0——
# bench 四格（2 种子 × 2 重复）的剧本完全一致，视频差异只来自生成侧。
# 单独 vh run 也可用（固定种子 20260816）。
task_name: story_seed_check
segments: 1

pipeline:
  script:
    adapter: script.deepseek-v4-flash
    params: {model: deepseek-chat, temperature: 0.0}
  generator:
    adapter: generator.minimax-h3-local
    params:
      model_path: /data-ssd/lizhijun/models/MiniMax-H3
      gpu: "4,6"
      variant: t2va
      steps: 20
      seed: 20260816
  context:
    chain_mode: none
    anchor_refs: []

judge:
  adapter: judge.openai-compat
  params:
    base_url: http://127.0.0.1:8030/v1
    model: judge-qwen3.5-27b
    frame_samples: 2
    disable_thinking: true

script_judge: []   # 确定性检验：跳过剧本评审，保证四格剧本逐字一致

segment_judge:
  - {name: 与指令一致性, question: "视频是否准确呈现生成指令的主体/动作/镜头？", weight: 1.0, min_score: 6}
  - {name: 画面质量, question: "是否存在明显缺陷（畸形/闪变/崩坏）？", weight: 1.0, min_score: 6}

segment_retry: {max_attempts: 1, inject_feedback: false}

cost:
  gpu_price_usd_per_hour: 1.2
