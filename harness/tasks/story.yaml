# 故事短片任务：全模态生成 + 评测（2026-08 修订版）

# 设计要点（见 harness/README.md）：
# - 不再有"图像/TTS/音效"等分离阶段 —— 这些正被全模态模型吸收
# - 生成侧：一个 MediaGenerator（H3：文字+上下文 → 视频+原生音频）
# - 评测侧：逐段评测 + 跨段一致性评测（模型不会自己质检自己）

task_name: story_short

# ---- 故事规划模板（交给剧本 LLM）----
task:
  system: "你是一位AI短片导演。你只输出分镜计划，不负责生成画面。"
  user_template: |
    请根据主题"{query}"，写一个约30-45秒的完整短片分镜计划，共{segment_count}段（每段8-15秒）。

    ## 要求
    1. 全片只有一个主角，每段的 video_prompt 都必须用相同措辞描述主角外貌与服装（保证一致性）
    2. 每段 video_prompt 用中文写（50-90字）：包含镜头运动、主体动作、环境动态、情绪氛围
    3. 若视频模型支持原生音频，在 video_prompt 末尾补充音频要求，格式：
       "音频：<环境音/音效>，并用中文旁白清晰朗读：「<该段的 narration 文本>」"
    4. 段间镜头要求：每段的开头镜头须与上一段结尾自然衔接，但机位/景别必须变化
       （例如上一段是人物特写，下一段开头换成中景或全景），避免"冻结帧"式跳切
    5. narration：每段的中文字幕文本（≤15字，是画面旁白/对白，与画面同步）

    ## 严格按 JSON 格式输出：
    ```json
    {{
      "segments": [
        {{"video_prompt": "...", "narration": "...", "duration": 8}},
        {{"video_prompt": "...", "narration": "...", "duration": 8}}
      ]
    }}
    ```
  defaults:
    segment_count: 4

# ---- 流水线声明 ----
pipeline:
  script:
    adapter: script.deepseek-v4-flash
    params: {model: deepseek-chat, temperature: 0.8}
  generator:
    adapter: generator.minimax-h3-local   # 本地开源权重（768p+原生音频）
    # adapter: generator.minimax-h3-api   # 官方API完整流程（2K）
    params:
      model_path: /data-ssd/lizhijun/models/MiniMax-H3
      gpu: "4,6"
      variant: fl2va
      guidance_scale: 4.5
      steps: 30          # 实验档：30 步（默认约49步，质量更高但更慢）
      seed: 20260814
  context:
    # 全片角色/风格锚点（可选，Ref2VA 模式下 ≤9 张）
    anchor_refs: []

# ---- Judge（本地 vLLM 多模态模型）----
judge:
  adapter: judge.openai-compat
  params:
    base_url: http://127.0.0.1:8030/v1
    model: judge-qwen3.5-27b
    frame_samples: 4

# ---- 逐段评测维度 ----
segment_judge:
  - {name: 与指令一致性, question: "视频是否准确呈现生成指令描述的主体、动作、镜头与环境？", weight: 1.0, min_score: 6, aliases: [一致性]}
  - {name: 画面质量, question: "是否存在明显缺陷（肢体畸形、闪变、主体崩坏、水印杂质）？无缺陷给高分", weight: 1.0, min_score: 6}
  - {name: 音效场景相符, question: "画面内容是否与指令描述的音效场景相符（如'键盘敲击声'应有打字动作、'风声'应有环境飘动）？", weight: 0.8, min_score: 5}

# ---- 跨段一致性评测（成片后）----
cross_judge:
  - {name: 跨段一致性, question: "上一段结尾与下一段开头：人物外貌服装是否一致、场景是否自然衔接？", weight: 1.0, min_score: 6}
  - {name: 叙事推进, question: "这两帧是否为合理推进的新镜头（机位/景别有变化、叙事在发展），而不是同一画面的复制（冻结帧）？完全相同的画面应给低分", weight: 1.0, min_score: 5}

# ---- 重试策略 ----
segment_retry: {max_attempts: 2, inject_feedback: true}

# ---- 音频验证（转写原生音频与旁白比对）----
audio_verify:
  adapter: transcribe.sensevoice-small
