# 通用视频故事任务 —— 无领域模板
# 业务内容由运行时 --query/--brief 给出；质量风格由经验记忆（环境反馈）注入。
# 本文件只做：管线声明 + 评测维度（通用质量传感器）+ 重试策略。

task_name: story_short
segments: 4

pipeline:
  script:
    adapter: script.deepseek-v4-flash
    params: {model: deepseek-chat, temperature: 0.9}
  generator:
    adapter: generator.minimax-h3-local
    params:
      model_path: /data-ssd/lizhijun/models/MiniMax-H3
      gpu: "4,6"
      variant: t2va
      steps: 30
      seed: 20260815
  context:
    chain_mode: none
    anchor_refs: []

judge:
  adapter: judge.openai-compat
  params:
    base_url: http://127.0.0.1:8030/v1
    model: judge-qwen3.5-27b
    frame_samples: 4
    disable_thinking: true

# ---- 剧本自主优化（多轮进化：候选生成→裁判评分→反馈入记忆→择优）----
script_optimize:
  rounds: 2
  candidates: 2
  target_score: 7.5

# ---- 剧本评测（文本）：失败反馈进经验记忆，跨任务泛化 ----
script_judge:
  - {name: 叙事完整, question: "分镜是否构成完整有起伏的故事，段间有因果与推进？", weight: 1.0, min_score: 6}
  - {name: 旁白自然, question: "旁白是否像真人说话（口语化、有情绪、长短句结合），而不是口号式短句或播音腔？僵硬口号给低分", weight: 1.2, min_score: 6, aliases: [自然度, 口语化]}
  - {name: 可生成性, question: "画面指令是否具体可执行（主体/动作/镜头明确），适合视频模型直接生成？", weight: 1.0, min_score: 6}

script_retry: {max_attempts: 2, inject_feedback: true}

# ---- 逐段评测（画面）----
segment_judge:
  - {name: 与指令一致性, question: "视频是否准确呈现生成指令描述的主体、动作、镜头与环境？", weight: 1.0, min_score: 6, aliases: [一致性]}
  - {name: 画面质量, question: "是否存在明显缺陷（肢体畸形、闪变、主体崩坏、水印杂质）？无缺陷给高分", weight: 1.0, min_score: 6}
  - {name: 音效场景相符, question: "画面内容是否与指令描述的音效场景相符？", weight: 0.8, min_score: 5}

segment_retry: {max_attempts: 2, inject_feedback: true}

# ---- 跨段评测 ----
cross_judge:
  - {name: 跨段一致性, question: "上一段结尾与下一段开头：人物外貌服装是否一致、场景是否自然衔接？", weight: 1.0, min_score: 6}
  - {name: 叙事推进, question: "这两帧是否为合理推进的新镜头（机位/景别有变化），而不是同一画面的复制（冻结帧）？完全相同的画面应给低分", weight: 1.0, min_score: 5}

# ---- 音频验证（转写原生音频与旁白比对）----
audio_verify:
  adapter: transcribe.sensevoice-small

# ---- 经验记忆（环境反馈在此积累；promote_threshold=2：同类问题出现两次提升为跨任务经验）----
memory:
  path: _memory.jsonl
  promote_threshold: 2
